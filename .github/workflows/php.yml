name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  # SQLite suite on each supported PHP version, plus style, static
  # analysis and a dependency audit (O3).
  tests:
    name: PHP ${{ matrix.php }} (SQLite)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, sqlite3, pdo_sqlite, zip, gd, bcmath, intl
        coverage: none

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php }}-

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Audit dependencies for known vulnerabilities
      run: composer audit --no-interaction --abandoned=report

    - name: Build front-end assets
      run: npm ci && npm run build

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run tests
      run: php artisan test

    - name: Code style (Pint)
      if: matrix.php == '8.4'
      run: vendor/bin/pint --test

    - name: Static analysis (PHPStan)
      if: matrix.php == '8.4'
      run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # Production runs MariaDB. Migration and SQL bugs that SQLite accepts
  # show up here (O3).
  mariadb:
    name: PHP 8.4 (MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mybooks_test
          MARIADB_USER: mybooks
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Real environment variables win over phpunit.xml's SQLite settings.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mybooks_test
      DB_USERNAME: mybooks
      DB_PASSWORD: secret

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_mysql, zip, gd, bcmath, intl
        coverage: none

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php8.4-

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Build front-end assets
      run: npm ci && npm run build

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run migrations from scratch
      run: php artisan migrate --force

    - name: Run tests
      run: php artisan test
